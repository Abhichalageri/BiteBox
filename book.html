<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bite Box | Welcome</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
      url("im1.jpg") center/cover no-repeat;
      min-height:100vh;
      color:white;
    }

    /* HEADER */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 50px;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(10px);
    }

    header h1{
      color:#ffcc00;
      font-size:32px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:25px;
      font-weight:500;
      transition:0.3s;
    }

    nav a:hover{
      color:#ffcc00;
    }

    /* HERO */
    .hero{
      height:60vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      animation:fadeIn 1.2s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(30px);}
      to{opacity:1; transform:translateY(0);}
    }

    .hero img{
      width:180px;
      margin-bottom:20px;
    }

    .search-box{
      display:flex;
      width:60%;
      max-width:600px;
      background:white;
      border-radius:50px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .search-box input{
      flex:1;
      border:none;
      padding:15px 20px;
      font-size:16px;
      outline:none;
    }

    .search-box button{
      background:#ffcc00;
      border:none;
      padding:0 25px;
      font-size:18px;
      cursor:pointer;
      color:#b30000;
    }

    /* FOOD SECTION */
    .food-section{
      padding:60px 40px;
      text-align:center;
    }

    .food-section h2{
      color:#ffcc00;
      font-size:32px;
      margin-bottom:40px;
    }

    .food-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
      gap:30px;
    }

    .food-card{
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      padding:25px;
      border-radius:20px;
      transition:0.4s;
    }

    .food-card:hover{
      transform:translateY(-10px) scale(1.05);
      background:rgba(255,204,0,0.25);
    }

    .food-card h3{
      margin-bottom:15px;
    }

    .food-card a{
      display:inline-block;
      padding:8px 18px;
      background:#ffcc00;
      color:#b30000;
      border-radius:20px;
      text-decoration:none;
      font-weight:600;
    }

    /* FOOTER */
    footer{
      text-align:center;
      padding:20px;
      background:rgba(0,0,0,0.7);
      font-size:14px;
      margin-top:40px;
    }

    @media(max-width:768px){
      .search-box{
        width:90%;
      }
      header{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 Bite Box</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="#">Orders</a>
    <a href="#">Profile</a>
    <a href="log.html">Logout</a>
  </nav>
</header>

<section class="hero">
  <img src="im9.png" alt="Bite Box">
  <div class="search-box">
    <input type="text" placeholder="Search dish or restaurant">
    <button>Search</button>
  </div>
</section>

<section class="food-section">
  <h2>WHAT'S ON YOUR MIND</h2>

  <div class="food-grid">
    <div class="food-card"><h3>Biryani</h3><a href="biryani.html">Explore</a></div>
    <div class="food-card"><h3>Pizza</h3><a href="pizacart.html">Explore</a></div>
    <div class="food-card"><h3>Dosa</h3><a href="dosa.html">Explore</a></div>
    <div class="food-card"><h3>Burger</h3><a href="burger.html">Explore</a></div>
    <div class="food-card"><h3>South Indian</h3><a href="south.html">Explore</a></div>
    <div class="food-card"><h3>Paneer</h3><a href="panner.html">Explore</a></div>
    <div class="food-card"><h3>Rolls</h3><a href="roll.html">Explore</a></div>
    <div class="food-card"><h3>Thali</h3><a href="thail.html">Explore</a></div>
  </div>
</section>

<footer>
  © 2025 Bite Box | Food that makes you happy 🍕
</footer>

</body>
</html>
