<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bite Box | Register</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      url('im4.jpg') center/cover no-repeat;
    }

    .register-box{
      width:420px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      border-radius:20px;
      padding:30px;
      color:white;
      animation:slideUp 1s ease;
    }

    @keyframes slideUp{
      from{transform:translateY(50px); opacity:0;}
      to{transform:translateY(0); opacity:1;}
    }

    h2{
      text-align:center;
      margin-bottom:5px;
      color:#ffcc00;
    }

    p{
      text-align:center;
      font-size:14px;
      margin-bottom:20px;
    }

    input{
      width:100%;
      height:42px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      padding:0 15px;
      outline:none;
    }

    button{
      width:100%;
      height:45px;
      margin-top:15px;
      background:#ffcc00;
      border:none;
      border-radius:25px;
      font-size:18px;
      font-weight:600;
      color:#b30000;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ffaa00;
      transform:scale(1.05);
    }

    .gender{
      margin-top:10px;
      text-align:center;
    }

    .gender .options{
      display:flex;
      justify-content:center;
      gap:25px;
      margin-top:5px;
    }

    .gender label{
      cursor:pointer;
      font-size:14px;
    }

    .gender label{
      margin:0 15px;
      cursor:pointer;
    }

    .food-section{
      display:flex;
      justify-content:space-around;
      margin-top:15px;
    }

    .food-card{
      width:100px;
      background:white;
      color:black;
      border-radius:12px;
      padding:10px;
      text-align:center;
      animation:float 3s ease-in-out infinite;
    }

    .food-card img{
      width:60px;
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-10px);}
      100%{transform:translateY(0);}
    }

    a{
      display:block;
      text-align:center;
      margin-top:12px;
      color:#00ffff;
      text-decoration:none;
    }

    a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <form class="register-box" action="book.html">
    <h2>🍔 Bite Box</h2>
    <p>Create your Bite Box account & order tasty food</p>

    <input type="text" placeholder="Username" required>

    <input type="email" placeholder="Email" required>

    <input type="tel" placeholder="+91-9876543210" pattern="^\+91-[6-9]\d{9}$" required>

    <input type="password" placeholder="Password" required>

    <div class="gender">
      <b>Gender</b><br>
      <div class="options">
        <label><input type="radio" name="gender"> Male</label>
        <label><input type="radio" name="gender"> Female</label>
      </div>
    </div>

    <!-- Food Items -->
    <div class="food-section">
      <div class="food-card">
        <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
        <p>Veg</p>
      </div>
      <div class="food-card">
        <img src="https://cdn-icons-png.flaticon.com/512/1046/1046751.png">
        <p>Non‑Veg</p>
      </div>
    </div>

    <button>Register</button>
    <a href="log.html">Already have an account? Login</a>
  </form>

</body>
</html>
