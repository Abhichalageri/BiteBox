<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bite Box | Reset Password</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
      url('im1.jpg') center/cover no-repeat;
    }

    .reset-box{
      width:380px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      border-radius:20px;
      padding:35px 30px;
      color:white;
      text-align:center;
      animation:slideIn 1s ease;
    }

    @keyframes slideIn{
      from{transform:translateY(40px); opacity:0;}
      to{transform:translateY(0); opacity:1;}
    }

    .reset-box h2{
      color:#ffcc00;
      margin-bottom:5px;
    }

    .reset-box p{
      font-size:14px;
      margin-bottom:20px;
      opacity:0.9;
    }

    input{
      width:100%;
      height:42px;
      margin:10px 0;
      border:none;
      border-radius:25px;
      padding:0 15px;
      outline:none;
      font-size:14px;
    }

    button{
      width:100%;
      height:45px;
      margin-top:15px;
      background:#ffcc00;
      border:none;
      border-radius:25px;
      font-size:17px;
      font-weight:600;
      color:#b30000;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ffaa00;
      transform:scale(1.05);
    }

    a{
      display:block;
      margin-top:15px;
      color:#00ffff;
      text-decoration:none;
      font-size:14px;
    }

    a:hover{
      text-decoration:underline;
    }

    .food-icons{
      font-size:32px;
      margin-bottom:10px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-8px);}
      100%{transform:translateY(0);}
    }

  </style>
</head>
<body>

  <form class="reset-box" action="log.html">
    <div class="food-icons">🍔 🔐 🍕</div>
    <h2>Reset Password</h2>
    <p>Create a new password for your Bite Box account</p>

    <input 
      type="password" 
      placeholder="New Password"
      pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
      required
    />

    <input 
      type="password" 
      placeholder="Confirm Password"
      pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
      required
    />

    <button>Update Password</button>

    <a href="log.html">Back to Login</a>
  </form>

</body>
</html>
