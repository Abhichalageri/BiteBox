        /* General Styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f9;
}

header {
    background-color: rgb(37, 113, 128);
    color: #fff;
    padding: 15px 0;
    text-align: center;
}

header h1 {
    margin: 0;
}

nav ul {
    list-style-type: none;
    padding: 0;
}

nav ul li {
    display: inline;
    margin: 0 15px;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    background-color: rgb(236, 4, 4);
    color: white;
    text-align: center;
    padding: 50px 20px;
}

.hero h2 {
    margin-top: 0;
    font-size: 36px;
    color: ;
}

.hero p {
    font-size: 18px;
    margin: 10px 0 20px;
}

.btn {
    background-color: #23798f;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
}

.btn:hover {
    background-color: #238396;
}

.book-section {
    padding: 50px 20px;
    text-align: center;
    background-color: rgb(152, 193, 226);
}

.book-section h2 {
    margin-bottom: 30px;
}

.book-list {
    height: max-content;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    
    
}

.book {
    background-color: #e0abab;
    padding: 20px;
    border-radius: 10px;
    width: 800px;
    height: 200px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: space-between;
}
.book .book-info{
    /* border: 2px solid black; */
    width: 60%;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center
}

.book img {
    width: ;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    display: flex;
    justify-content: center;
}

.book h3 {
    font-size: 20px;
    margin: 15px 0 10px;
}

.book p {
    font-size: 18px;
    margin: 0;
    color: #ff006e;
}

footer {
    background-color: rgba(0, 0, 0, 0.733);
    padding: 10px;
    color: white;
    text-align: center;
    font-size: 14px;
    background-color: rgb(192, 102, 56);
}

    </style>
