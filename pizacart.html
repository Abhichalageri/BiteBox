<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔴 CHANGE PAGE TITLE -->
<title>Bite Box | Pizza</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background:#f5f5f5;
}

/* Header */
header{
    background:linear-gradient(135deg,#ff4b2b,#ff416c);
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:32px;
}

/* Filter Section */
.filters{
    background:#fff;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.filters select{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid #ccc;
}

/* Restaurant Section */
.section-title{
    text-align:center;
    margin:30px 0;
    font-size:26px;
    color:#333;
}

.restaurant-list{
    display:flex;
    flex-direction:column;
    gap:20px;
    max-width:900px;
    margin:auto;
    padding-bottom:40px;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:120px;
    height:120px;
    border-radius:12px;
    object-fit:cover;
}

.card-info{
    flex:1;
    margin-left:20px;
}

.card-info h3{
    margin-bottom:5px;
}

.card-info p{
    color:#777;
    font-size:14px;
}

.btn{
    background:#ff4b2b;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn:hover{
    background:#e63b1e;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:10px;
}
</style>
</head>

    <!-- 🔴 CHANGE FOOD NAME -->
    <h1>🍕 Pizza Restaurants</h1>

        <option>Sort by Price</option>

    <select>

        <option>Veg</option>

    </select>

    <select>
        <option>Distance</option>
        <option>5 km</option>
        <option>10 km</option>
        <option>15 km</option>
    </select>

    <select>
        <option>Rating</option>
        <option>5 ★</option>
        <option>4 ★</option>
        <option>3 ★</option>
    </select>
</div>
